<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GPA / CGPA Calculator</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 30px;
}
table {
  margin: auto;
  border-collapse: collapse;
  width: 90%;
  max-width: 750px;
}
th, td {
  border: 1px solid #334155;
  padding: 10px;
}
th {
  background: #1e293b;
}
input, select, button {
  padding: 8px;
  width: 100%;
}
button {
  background: #2563eb;
  color: white;
  border: none;
  cursor: pointer;
  margin-top: 10px;
}
.add-btn {
  background: #16a34a;
}
.result {
  margin-top: 15px;
  font-size: 20px;
}
</style>
</head>

<body>

<h1>GPA / CGPA Calculator</h1>
<p>Enter subjects, credits & grades</p>

<table id="subjectTable">
<tr>
  <th>Subject</th>
  <th>Credits</th>
  <th>Grade</th>
</tr>

<tr>
  <td><input type="text" placeholder="Subject 1"></td>
  <td><input type="number" class="credit"></td>
  <td>
    <select class="grade">
      <option value="">--Select--</option>
      <option value="10">O (10)</option>
      <option value="9">A+ (9)</option>
      <option value="8">A (8)</option>
      <option value="7">B+ (7)</option>
      <option value="6">B (6)</option>
      <option value="5">C (5)</option>
      <option value="4">D (4)</option>
      <option value="0">F (0)</option>
    </select>
  </td>
</tr>

<tr>
  <td><input type="text" placeholder="Subject 2"></td>
  <td><input type="number" class="credit"></td>
  <td>
    <select class="grade">
      <option value="">--Select--</option>
      <option value="10">O (10)</option>
      <option value="9">A+ (9)</option>
      <option value="8">A (8)</option>
      <option value="7">B+ (7)</option>
      <option value="6">B (6)</option>
      <option value="5">C (5)</option>
      <option value="4">D (4)</option>
      <option value="0">F (0)</option>
    </select>
  </td>
</tr>

<tr>
  <td><input type="text" placeholder="Subject 3"></td>
  <td><input type="number" class="credit"></td>
  <td>
    <select class="grade">
      <option value="">--Select--</option>
      <option value="10">O (10)</option>
      <option value="9">A+ (9)</option>
      <option value="8">A (8)</option>
      <option value="7">B+ (7)</option>
      <option value="6">B (6)</option>
      <option value="5">C (5)</option>
      <option value="4">D (4)</option>
      <option value="0">F (0)</option>
    </select>
  </td>
</tr>

</table>

<button class="add-btn" onclick="addRow()">➕ Add Subject</button>
<button onclick="calculateGPA()">Calculate GPA</button>

<div class="result" id="result"></div>
<div class="result" id="quote"></div>

<script>
function addRow() {
  let table = document.getElementById("subjectTable");
  let row = table.insertRow();
  row.innerHTML =
    '<td><input type="text" placeholder="New Subject"></td>' +
    '<td><input type="number" class="credit"></td>' +
    '<td><select class="grade">' +
    '<option value="">--Select--</option>' +
    '<option value="10">O (10)</option>' +
    '<option value="9">A+ (9)</option>' +
    '<option value="8">A (8)</option>' +
    '<option value="7">B+ (7)</option>' +
    '<option value="6">B (6)</option>' +
    '<option value="5">C (5)</option>' +
    '<option value="4">D (4)</option>' +
    '<option value="0">F (0)</option>' +
    '</select></td>';
}

function calculateGPA() {
  let credits = document.getElementsByClassName("credit");
  let grades = document.getElementsByClassName("grade");

  let totalCredits = 0;
  let totalPoints = 0;

  for (let i = 0; i < credits.length; i++) {
    let c = parseFloat(credits[i].value);
    let g = parseFloat(grades[i].value);

    if (!isNaN(c) && !isNaN(g)) {
      totalCredits += c;
      totalPoints += c * g;
    }
  }

  if (totalCredits === 0) {
    document.getElementById("result").innerText =
      "Please enter credits and grades.";
    document.getElementById("quote").innerText = "";
    return;
  }

  let gpa = totalPoints / totalCredits;
  document.getElementById("result").innerText =
    "Your GPA is: " + gpa.toFixed(2);

  let quote = "";

  if (gpa >= 9) quote = "🔥 Outstanding! Elite performance.";
  else if (gpa >= 8) quote = "💪 Excellent work. Keep pushing.";
  else if (gpa >= 7) quote = "👏 Very good. You’re on track.";
  else if (gpa >= 6) quote = "📈 Good effort. Improve steadily.";
  else if (gpa >= 5) quote = "⚡ You can do better. Don’t settle.";
  else quote = "🚀 This is not the end. Come back stronger.";

  document.getElementById("quote").innerText = quote;
}
</script>

</body>
</html>
